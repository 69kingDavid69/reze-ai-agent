# Fly.io config — Reze
# Free tier: $5/mes de crédito → con 1 VM 512MB shared-CPU es ~$3-5/mes (entra justo).
# El nombre `app` lo va a sobreescribir `flyctl launch` con el que vos elijas.

app = "reze-anime"
primary_region = "scl"   # Santiago de Chile — el más cercano a Argentina con buen ping

[build]

[env]
  PORT = "8000"
  REZE_DB = "/data/reze_state.db"
  FASTEMBED_CACHE_DIR = "/data/fastembed_cache"

[http_service]
  internal_port = 8000
  force_https = true
  # auto_stop = "stop" hace que la app se duerma sin tráfico → menos consumo de créditos.
  # Cold-start de Fly es ~3-8s (Render free duerme y tarda ~30s — Fly es mejor en esto).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 80

# Volumen persistente: 1GB free para reze_state.db + cache de embeddings.
# Sobrevive deploys, restarts, y machine reschedules.
[[mounts]]
  source = "reze_data"
  destination = "/data"

# VM más chica que entra en free tier.
# Si tenés mucha latencia o el modelo no carga, bumpear a memory_mb = 1024.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
