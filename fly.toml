# fly.toml app configuration file generated for reze-anime on 2026-05-14T12:00:46-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'reze-anime'
primary_region = 'gru'

[build]

[env]
  FASTEMBED_CACHE_DIR = '/data/fastembed_cache'
  PORT = '8000'
  REZE_DB = '/data/reze_state.db'

[[mounts]]
  source = 'reze_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 80
    soft_limit = 50

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
