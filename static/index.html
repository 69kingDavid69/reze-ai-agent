<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reze</title>
  <!-- cache-bust: v5 -->

  <!-- Live2D Cubism Core (debe cargarse primero) -->
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <!-- PixiJS 6 + pixi-live2d-display Cubism4 -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a14;
      color: #e8e0f0;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: row;
    }

    /* ── Live2D panel ── */
    #live2d-container {
      flex: 0 0 45%;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: linear-gradient(180deg, #0a0a14 0%, #120a24 60%, #1a0e2e 100%);
      overflow: hidden;
    }

    #live2d-canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    #live2d-state {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #7c3aed;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.3s;
      white-space: nowrap;
      z-index: 10;
    }
    #live2d-state.visible { opacity: 1; }

    /* ── Chat panel ── */
    #chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-left: 1px solid #2a1f3d;
      overflow: hidden;
    }

    header {
      width: 100%;
      max-width: 620px;
      padding: 18px 24px 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid #2a1f3d;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid #7c3aed;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .agent-info h1 {
      font-size: 17px;
      font-weight: 700;
      color: #d9a0ff;
    }
    .agent-info p {
      font-size: 11px;
      color: #7a6a8a;
    }

    .clear-btn {
      margin-left: auto;
      background: none;
      border: 1px solid #2a1f3d;
      color: #7a6a8a;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .clear-btn:hover { border-color: #7c3aed; color: #d9a0ff; }

    #chat {
      flex: 1;
      width: 100%;
      max-width: 620px;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 88%;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.reze { align-self: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
    }

    .msg.user .bubble {
      background: #2a1f3d;
      color: #e8e0f0;
      border-bottom-right-radius: 4px;
    }
    .msg.reze .bubble {
      background: linear-gradient(135deg, #1e0a2e, #0a0a2e);
      border: 1px solid #4a1a6a;
      color: #f0d0ff;
      border-bottom-left-radius: 4px;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .msg.reze .msg-avatar  { background: transparent; overflow: hidden; border: 1px solid #7c3aed; }
    .msg.reze .msg-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .msg.user .msg-avatar  { background: #2a1f3d; color: #9a8aaa; }

    .thinking {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 12px 16px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #7c3aed;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-8px); }
    }

    footer {
      width: 100%;
      max-width: 620px;
      padding: 14px 16px;
      border-top: 1px solid #2a1f3d;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #text-input {
      flex: 1;
      background: #1a1224;
      border: 1px solid #2a1f3d;
      border-radius: 12px;
      padding: 11px 15px;
      color: #e8e0f0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #text-input:focus { border-color: #7c3aed; }
    #text-input::placeholder { color: #4a3a5a; }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    #send-btn {
      background: linear-gradient(135deg, #6e2fa0, #7c3aed);
      color: white;
    }
    #send-btn:hover { opacity: 0.85; }

    #mic-btn {
      background: #1a1224;
      border: 1px solid #2a1f3d;
      color: #9a8aaa;
    }
    #mic-btn:hover { border-color: #7c3aed; color: #d9a0ff; }
    #mic-btn.listening {
      background: #1a0a3e;
      border-color: #7c3aed;
      color: #c084fc;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(124,58,237,0.4); }
      50%       { box-shadow: 0 0 0 8px rgba(124,58,237,0); }
    }

    #status {
      font-size: 11px;
      color: #4a3a5a;
      text-align: center;
      padding-bottom: 4px;
      min-height: 16px;
    }
    #status-bar {
      width: 100%;
      max-width: 620px;
      padding: 0 16px;
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      #live2d-container { flex: 0 0 38vh; border-bottom: 1px solid #2a1f3d; }
      #chat-panel { border-left: none; }
    }
  </style>
</head>
<body>

<!-- Live2D panel -->
<div id="live2d-container">
  <canvas id="live2d-canvas"></canvas>
  <div id="live2d-state">idle</div>
</div>

<!-- Chat panel -->
<div id="chat-panel">

  <header>
    <div class="avatar"><img src="/static/asuka-avatar.png" alt="Reze" /></div>
    <div class="agent-info">
      <h1>Reze</h1>
      <p>Tsundere AI</p>
    </div>
    <button class="clear-btn" onclick="clearHistory()">Limpiar chat</button>
  </header>

  <div id="chat"></div>

  <div id="status-bar">
    <div id="status"></div>
  </div>

  <footer>
    <button class="icon-btn" id="mic-btn" title="Hablar" onclick="toggleMic()">🎤</button>
    <input id="text-input" type="text" placeholder="Escribile a Reze..." autocomplete="off"
      onkeydown="if(event.key==='Enter') sendText()" />
    <button class="icon-btn" id="send-btn" title="Enviar" onclick="sendText()">➤</button>
  </footer>

</div>

<script>
  // ── DOM refs ──
  const chat    = document.getElementById('chat')
  const status  = document.getElementById('status')
  const micBtn  = document.getElementById('mic-btn')
  const textIn  = document.getElementById('text-input')
  const stateEl = document.getElementById('live2d-state')

  let isListening = false
  let recognition = null
  let isBusy      = false

  const sessionId = crypto?.randomUUID?.() ?? Math.random().toString(36).slice(2) + Date.now().toString(36)

  // ── Web Speech API – STT ──
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition
  if (SpeechRecognition) {
    recognition = new SpeechRecognition()
    recognition.lang = 'es-AR'
    recognition.interimResults = false
    recognition.maxAlternatives = 1
    recognition.onresult = (e) => { stopListening(); sendMessage(e.results[0][0].transcript) }
    recognition.onerror  = () => stopListening()
    recognition.onend    = () => stopListening()
  }

  function toggleMic() {
    if (isBusy) return
    isListening ? stopListening() : startListening()
  }
  function startListening() {
    if (!recognition) { setStatus('Tu browser no soporta micrófono.'); return }
    isListening = true
    micBtn.classList.add('listening')
    micBtn.textContent = '🔴'
    setStatus('Escuchando...')
    setLive2DState('escuchando')
    recognition.start()
  }
  function stopListening() {
    isListening = false
    micBtn.classList.remove('listening')
    micBtn.textContent = '🎤'
    setStatus('')
    setLive2DState('idle')
    try { recognition.stop() } catch {}
  }

  // ── TTS – ElevenLabs via /tts ──
  let lipsyncTimer = null

  async function speak(text, onEnd) {
    try {
      const res = await fetch('/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      })
      if (!res.ok) throw new Error('tts_unavailable')
      const blob = await res.blob()
      const url  = URL.createObjectURL(blob)
      const audio = new Audio(url)
      audio.onplay  = () => startLipSync()
      audio.onended = () => { stopLipSync(); URL.revokeObjectURL(url); onEnd?.() }
      audio.onerror = () => { stopLipSync(); URL.revokeObjectURL(url); onEnd?.() }
      audio.play()
    } catch {
      // Si ElevenLabs falla, igual termina el turno
      stopLipSync()
      onEnd?.()
    }
  }

  // ── Live2D ──
  let live2dModel  = null
  let live2dApp    = null

  // Solo expresiones que NO muestran brazos extra en respuestas normales.
  // Las expresiones con brazos (paz=Param27, cubrir_cara=Param26) solo
  // aparecen cuando el MOTION correspondiente los anima directamente.
  const EXPR_MAP = {
    neutral:   null,
    arrogante: 'enojo',     // marca de enojo — sin brazos
    enojo:     'enojo',     // marca de enojo
    flustered: 'rubor',     // rubor en mejillas — sin brazos
    posesivo:  'estrellas', // ojos de estrella — sin brazos
    sorpresa:  'sudor',     // gota de sudor — sin brazos
    dulce:     'rubor',     // rubor suave — sin brazos
  }

  async function initLive2D() {
    const container = document.getElementById('live2d-container')
    live2dApp = new PIXI.Application({
      view: document.getElementById('live2d-canvas'),
      autoStart: true,
      backgroundAlpha: 0,
      width:  container.clientWidth,
      height: container.clientHeight,
      resolution: window.devicePixelRatio || 1,
      antialias: true,
    })

    try {
      const model = await PIXI.live2d.Live2DModel.from('/static/live2d/reze/reze.model3.json')
      live2dModel = model
      live2dApp.stage.addChild(model)

      // Escalar para ocupar el alto del panel
      const scale = (live2dApp.screen.height / model.height) * 0.95
      model.scale.set(scale)
      model.anchor.set(0.5, 1.0)
      model.x = live2dApp.screen.width  / 2
      model.y = live2dApp.screen.height + 20

      // Idle automático
      model.motion('idle', 0, PIXI.live2d.MotionPriority.IDLE)

      // Redimensionar si cambia el contenedor
      window.addEventListener('resize', () => {
        live2dApp.renderer.resize(container.clientWidth, container.clientHeight)
        const s = (live2dApp.screen.height / model.height) * 0.95
        model.scale.set(s)
        model.x = live2dApp.screen.width  / 2
        model.y = live2dApp.screen.height + 20
      })

      console.log('[Live2D] Modelo cargado:', model.width, 'x', model.height)
    } catch (err) {
      console.warn('[Live2D] No se pudo cargar el modelo:', err)
    }
  }

  function applyEmotion(emocion) {
    if (!live2dModel) return
    const exprName = EXPR_MAP[emocion] ?? null
    if (exprName) {
      live2dModel.expression(exprName)
    } else {
      live2dModel.expression()  // reset a default
    }
  }

  function startLipSync() {
    if (!live2dModel) return
    let t = 0
    lipsyncTimer = setInterval(() => {
      t += 0.35
      const val = (Math.sin(t) * 0.5 + 0.5) * 0.85
      try {
        live2dModel.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', val)
      } catch {}
    }, 50)
  }

  function stopLipSync() {
    clearInterval(lipsyncTimer)
    lipsyncTimer = null
    try {
      live2dModel?.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', 0)
    } catch {}
  }

  const DANCE_MOTIONS = new Set(['dance_kpop', 'dance_squat'])
  let isDancing      = false
  let danceStopTimer = null   // para auto-detener a los 12 s
  let danceLoopTimer = null   // para re-triggear cada 1.9 s

  function stopDance() {
    isDancing = false
    if (danceStopTimer) { clearTimeout(danceStopTimer);  danceStopTimer = null }
    if (danceLoopTimer) { clearInterval(danceLoopTimer); danceLoopTimer = null }
  }

  function triggerMotion(motionName) {
    if (!live2dModel) return

    // Si hay un baile activo, detenerlo limpiamente
    stopDance()

    isDancing = DANCE_MOTIONS.has(motionName)

    // Disparar el motion (FORCE siempre)
    const doPlay = () => {
      try {
        live2dModel.motion(motionName, 0, PIXI.live2d.MotionPriority.FORCE)
        console.log('[Reze] motion →', motionName)
      } catch(e) {
        console.error('[Reze] motion error:', motionName, e)
      }
    }

    doPlay()

    if (isDancing) {
      // Mostrar indicador visual
      stateEl.textContent = motionName === 'dance_kpop' ? '💃 kpop' : '💃 squat'
      stateEl.classList.add('visible')

      // Re-lanzar cada 1.9 s para garantizar que nunca para (sin depender de Loop:true)
      danceLoopTimer = setInterval(doPlay, 1900)

      // Detener automáticamente a los 12 s
      danceStopTimer = setTimeout(() => {
        stopDance()
        if (live2dModel) live2dModel.motion('idle', 0, PIXI.live2d.MotionPriority.FORCE)
        stateEl.classList.remove('visible')
      }, 12000)
    }
  }

  function setLive2DState(state) {
    // No pisar el indicador visual si está bailando
    if (!isDancing) {
      stateEl.textContent = state
      stateEl.classList.toggle('visible', state !== 'idle')
    }
    if (live2dModel && state === 'idle' && !isDancing) {
      live2dModel.expression()
      live2dModel.motion('idle', 0, PIXI.live2d.MotionPriority.IDLE)
    }
  }

  // ── Chat logic ──
  function sendText() {
    const msg = textIn.value.trim()
    if (!msg || isBusy) return
    textIn.value = ''
    sendMessage(msg)
  }

  async function sendMessage(text) {
    if (isBusy) return
    isBusy = true

    appendMsg('user', text)
    const thinkingEl = appendThinking()
    setStatus('Reze está pensando...')
    setLive2DState('pensando')

    const doFetch = () => fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId })
    })

    try {
      let res = await doFetch()
      if (!res.ok && res.status >= 500) {
        setStatus('Reintentando...')
        await new Promise(r => setTimeout(r, 2000))
        res = await doFetch()
      }

      if (!res.ok) {
        const body = await res.json().catch(() => ({}))
        thinkingEl.remove()
        appendMsg('reze', body.detail?.error === 'llm_unavailable'
          ? '...Tch. DeepSeek se cayó. No es mi culpa.'
          : '...Algo salió mal. Inténtalo de nuevo.')
        setStatus('')
        setLive2DState('idle')
        isBusy = false
        return
      }

      const { respuesta = '...', emocion = 'neutral', motion = 'talk' } = await res.json()

      thinkingEl.remove()
      appendMsg('reze', respuesta)
      setStatus('Reze está hablando...')
      setLive2DState('hablando')

      // Activar expresión y motion
      applyEmotion(emocion)
      triggerMotion(motion)

      speak(respuesta, () => {
        setStatus('')
        setLive2DState('idle')
        isBusy = false
      })

    } catch {
      thinkingEl.remove()
      appendMsg('reze', '...Tch. Sin conexión. Ni modo.')
      setStatus('')
      setLive2DState('idle')
      isBusy = false
    }
  }

  function appendMsg(role, text) {
    const wrap = document.createElement('div')
    wrap.className = `msg ${role}`

    const avatarEl = document.createElement('div')
    avatarEl.className = 'msg-avatar'
    if (role === 'reze') {
      const img = document.createElement('img')
      img.src = '/static/asuka-avatar.png'
      img.alt = 'Reze'
      avatarEl.appendChild(img)
    } else {
      avatarEl.textContent = '👤'
    }

    const bubble = document.createElement('div')
    bubble.className = 'bubble'
    bubble.textContent = text

    wrap.appendChild(avatarEl)
    wrap.appendChild(bubble)
    chat.appendChild(wrap)
    chat.scrollTop = chat.scrollHeight
    return wrap
  }

  function appendThinking() {
    const wrap = document.createElement('div')
    wrap.className = 'msg reze'

    const avatarEl = document.createElement('div')
    avatarEl.className = 'msg-avatar'
    const img = document.createElement('img')
    img.src = '/static/asuka-avatar.png'
    img.alt = 'Reze'
    avatarEl.appendChild(img)

    const bubble = document.createElement('div')
    bubble.className = 'bubble thinking'
    bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>'

    wrap.appendChild(avatarEl)
    wrap.appendChild(bubble)
    chat.appendChild(wrap)
    chat.scrollTop = chat.scrollHeight
    return wrap
  }

  async function clearHistory() {
    await fetch(`/history?session_id=${sessionId}`, { method: 'DELETE' })
    chat.innerHTML = ''
    setStatus('')
  }

  function setStatus(msg) { status.textContent = msg }

  // ── Init ──
  initLive2D()
</script>
</body>
</html>
